name: release

on:
  push:
    branches: [release]

jobs:
  publish:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Read version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dre") | .version')
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Bump the version in Cargo.toml before pushing to release."
            exit 1
          fi
      - run: cargo build --release
      - run: gh release create "$TAG" target/release/dre --title "$TAG" --target "$GITHUB_SHA"
