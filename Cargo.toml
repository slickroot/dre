[package]
name = "dre"
version = "0.5.0"
edition = "2021"

[workspace]
members = [".", "types", "web"]
resolver = "2"

[dependencies]
base64 = "0.22"
flate2 = "1"
fontdue = "0.9"
nix = { version = "0.31.3", features = ["term", "ioctl", "poll", "signal", "process", "fs"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
types = { path = "types" }

[dev-dependencies]
mockall = "0.15.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.10.3"
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
