[package]
name = "dre"
version = "0.4.0"
edition = "2021"

[workspace]
members = [".", "web"]
resolver = "2"

[dependencies]
base64 = "0.22"
flate2 = "1"
nix = { version = "0.31.3", features = ["term", "ioctl", "poll"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
