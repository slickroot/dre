[package]
name = "dre_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "dre_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22" }
base64 = "0.22"
flate2 = "1"
nix = { version = "0.31.3", features = ["term", "ioctl", "poll"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
