<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dre editor demo</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #f4f4f4; display: flex; justify-content: center; align-items: center; }
  @media (prefers-color-scheme: dark) { body { background: #111; } }
  #diagram { line-height: 0; }
  #diagram svg { display: block; }
</style>
</head>
<body>
<div id="diagram"></div>
<script type="module">
import init, { WebSession } from './pkg/dre_web.js';

const KEYS = [
  'b', 'P', 'l', 'a', 'n', '\x1b',
  's', 'B', 'u', 'i', 'l', 'd', '\x1b',
  's', 'S', 'h', 'i', 'p', '\x1b',
  'c',
  'f',
];
const DELAY_MS = 400;
const SCALE = 2;
const CELL_WIDTH = 8 * SCALE;
const CELL_HEIGHT = 16 * SCALE;

await init();

const container = document.getElementById('diagram');
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

const measureExtent = () => {
  const throwaway = new WebSession();
  for (const key of KEYS) {
    throwaway.press_key(key);
  }
  return throwaway.extent();
};

const [extentWidth, extentHeight] = measureExtent();
const session = new WebSession();

const show = () => {
  const cols = Math.floor(window.innerWidth / CELL_WIDTH);
  const rows = Math.floor(window.innerHeight / CELL_HEIGHT);
  container.innerHTML = session.svg(cols, rows, extentWidth, extentHeight);
  const svg = container.firstElementChild;
  svg.setAttribute('width', cols * CELL_WIDTH);
  svg.setAttribute('height', rows * CELL_HEIGHT);
};

window.addEventListener('resize', show);

show();
for (const key of KEYS) {
  await sleep(DELAY_MS);
  session.press_key(key);
  show();
}
</script>
</body>
</html>
